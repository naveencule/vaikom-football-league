<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaikom Football League 2025</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e0e;
  --bg1:#161616;
  --bg2:#1c1c1c;
  --bg3:#242424;
  --bg4:#2e2e2e;
  --line:rgba(255,255,255,0.06);
  --line2:rgba(255,255,255,0.12);
  --gold:#c9a84c;
  --gold2:#e8c96a;
  --gold-dim:rgba(201,168,76,0.10);
  --gold-rim:rgba(201,168,76,0.22);
  --tx:#e8e3db;
  --tx2:#7a7267;
  --tx3:#3a3530;
  --white:#f5f1eb;
}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}

/* ── HERO ── */
.hero{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:80px 24px 60px;text-align:center;
  position:relative;overflow:hidden;
  border-bottom:1px solid var(--line);
}
.hero-grain{
  position:absolute;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;opacity:0.4;
}
.hero-lines{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:80px 80px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,#000 40%,transparent 100%);
}
.hero-glow{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(201,168,76,0.05) 0%,transparent 70%);
  pointer-events:none;
}
.hero-inner{position:relative;z-index:1;max-width:800px}
.pill{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);
  background:var(--gold-dim);border:1px solid var(--gold-rim);
  padding:7px 16px;border-radius:2px;margin-bottom:40px;
}
.pill-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}
.hero-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(4rem,11vw,9.5rem);
  font-weight:900;line-height:0.88;
  color:var(--white);letter-spacing:-0.02em;margin-bottom:8px;
}
.hero-title .accent{
  display:block;color:transparent;
  -webkit-text-stroke:1.5px var(--gold);font-style:italic;
}
.hero-sub{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:0.24em;text-transform:uppercase;
  color:var(--tx3);margin-top:20px;margin-bottom:52px;
}
.stats-bar{
  display:inline-flex;align-items:stretch;
  border:1px solid var(--line2);border-radius:3px;
  overflow:hidden;background:var(--bg1);
}
.stat{padding:18px 40px;border-right:1px solid var(--line);text-align:center}
.stat:last-child{border-right:none}
.stat-n{
  font-family:'Playfair Display',serif;
  font-size:2.8rem;font-weight:700;
  color:var(--white);line-height:1;display:block;
}
.stat-l{
  font-size:10px;font-weight:500;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--tx3);
  margin-top:5px;display:block;font-family:'DM Mono',monospace;
}

/* ── MAIN ── */
.wrap{max-width:1280px;margin:0 auto;padding:56px 24px 100px}
.section-label{
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:0.22em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:28px;
  display:flex;align-items:center;gap:16px;
}
.section-label::before{content:'';width:24px;height:1px;background:var(--gold);opacity:0.5}
.section-label::after{content:'';flex:1;height:1px;background:var(--line)}

/* ── TEAM CARD ── */
.team-card{
  margin-bottom:4px;border-radius:3px;
  overflow:hidden;border:1px solid var(--line);
  transition:border-color 0.25s ease;
}
.team-card.open{border-color:var(--line2)}

/* ─ DESKTOP HEAD: bar | logo | info | manager | chevron ─ */
.tc-head{
  display:grid;
  grid-template-columns:4px 76px 1fr auto 52px;
  align-items:stretch;
  background:var(--bg1);cursor:pointer;
  min-height:84px;transition:background 0.2s;user-select:none;
}
.tc-head:hover{background:var(--bg2)}
.team-card.open .tc-head{background:var(--bg2);border-bottom:1px solid var(--line)}

.tc-bar{background:var(--gold);opacity:0.35;transition:opacity 0.25s}
.team-card.open .tc-bar{opacity:0.8}

.tc-logo-wrap{
  display:flex;align-items:center;justify-content:center;
  padding:10px 6px;border-right:1px solid var(--line);
}
.tc-logo{
  width:52px;height:52px;border-radius:3px;
  background:var(--bg3);border:1px solid var(--line2);
  overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.tc-logo img{width:100%;height:100%;object-fit:contain;display:block}
.tc-logo-text{
  font-family:'Playfair Display',serif;font-size:13px;font-weight:700;
  color:var(--gold);text-align:center;line-height:1.1;letter-spacing:0.04em;
}

.tc-info{
  display:flex;flex-direction:column;justify-content:center;
  padding:12px 22px;gap:8px;min-width:0;
}
.tc-name{
  font-family:'Playfair Display',serif;
  font-size:1.55rem;font-weight:700;
  color:var(--white);line-height:1;letter-spacing:-0.01em;
}
.tc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tc-chip{
  font-family:'DM Mono',monospace;font-size:9px;
  letter-spacing:0.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:2px;font-weight:500;
}
.tc-chip.g{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-rim)}
.tc-chip.w{background:rgba(255,255,255,0.04);color:var(--tx2);border:1px solid var(--line)}

/* ─ DESKTOP MANAGER STRIP ─ */
.tc-mgr{
  display:flex;align-items:center;gap:14px;
  padding:12px 22px;border-left:1px solid var(--line);
  min-width:200px;
}
.mgr-av{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;
  overflow:hidden;background:var(--bg3);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;
}
.mgr-av img{width:100%;height:100%;object-fit:cover;object-position:top}
.mgr-av-text{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;color:var(--gold)}
.mgr-role{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--tx3);margin-bottom:3px}
.mgr-name{font-size:13.5px;font-weight:600;color:var(--tx);line-height:1.2}
.mgr-phone{font-size:11px;color:var(--tx2);margin-top:1px}

/* ─ MOBILE MANAGER ROW (inside tc-info, always visible) ─ */
.tc-mgr-mobile{
  display:none; /* shown via media query */
  align-items:center;gap:10px;
  margin-top:4px;
}
.mgr-av-sm{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  overflow:hidden;background:var(--bg3);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;
}
.mgr-av-sm img{width:100%;height:100%;object-fit:cover;object-position:top}
.mgr-av-sm-text{font-family:'Playfair Display',serif;font-size:11px;font-weight:700;color:var(--gold)}
.mgr-mobile-info{}
.mgr-mobile-label{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--tx3)}
.mgr-mobile-name{font-size:12px;font-weight:600;color:var(--tx);line-height:1.2}

/* ─ CHEVRON ─ */
.tc-chev-cell{
  display:flex;align-items:center;justify-content:center;
  border-left:1px solid var(--line);
}
.tc-chev{
  width:28px;height:28px;border-radius:2px;
  background:var(--bg);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  color:var(--tx2);
  transition:transform 0.3s ease,background 0.2s,color 0.2s,border-color 0.2s;
}
.team-card.open .tc-chev{
  transform:rotate(180deg);
  background:var(--gold-dim);border-color:var(--gold-rim);color:var(--gold);
}
.tc-chev svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ─ ROSTER ─ */
.tc-roster{display:none;padding:22px;background:var(--bg)}
.team-card.open .tc-roster{display:block}

/* ─ PLAYER GRID ─ */
.pgrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(172px,1fr));
  gap:12px;
}

/* ─ PLAYER CARD ─ */
.pc{
  background:var(--bg1);border:1px solid var(--line);
  border-radius:3px;overflow:hidden;position:relative;
  display:flex;flex-direction:column;
  transition:transform 0.22s,border-color 0.22s;
}
.pc:hover{transform:translateY(-3px);border-color:var(--line2)}
.pc.icon{border-color:rgba(201,168,76,0.25)}
.pc.icon:hover{border-color:rgba(201,168,76,0.5)}
.pc-crown{
  position:absolute;top:8px;right:8px;z-index:4;
  font-family:'DM Mono',monospace;
  font-size:9px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;
  background:rgba(201,168,76,0.15);color:var(--gold2);border:1px solid rgba(201,168,76,0.3);
}
.pc-img{
  width:100%;aspect-ratio:3/4;background:var(--bg3);overflow:hidden;position:relative;
}
.pc-img img{
  width:100%;height:100%;object-fit:cover;object-position:top center;display:block;
  transition:transform 0.35s ease;
}
.pc:hover .pc-img img{transform:scale(1.05)}
.pc-img::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:56px;
  background:linear-gradient(transparent,var(--bg1));pointer-events:none;
}
.pc-ph{
  width:100%;height:100%;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:6px;
}
.pc-ph svg{opacity:0.08}
.pc-ph span{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:0.1em;font-family:'DM Mono',monospace}
.pc-body{padding:10px 12px 13px;flex:1;display:flex;flex-direction:column;gap:7px}
.pc-name{font-size:13.5px;font-weight:600;line-height:1.2;color:var(--white)}
.pc.icon .pc-name{color:var(--gold2)}
.pc-pos{
  display:inline-block;font-family:'DM Mono',monospace;
  font-size:9px;letter-spacing:0.07em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;
  background:rgba(255,255,255,0.04);color:var(--tx2);border:1px solid var(--line);width:fit-content;
}
.pc.icon .pc-pos{background:var(--gold-dim);color:var(--gold);border-color:var(--gold-rim)}
.pc-sep{height:1px;background:var(--line)}
.pc-tel a{
  display:flex;align-items:center;gap:7px;text-decoration:none;
  font-size:11px;color:var(--tx2);transition:color 0.18s;
}
.pc-tel a:hover{color:var(--gold)}
.pc-tel svg{width:11px;height:11px;flex-shrink:0;fill:currentColor;opacity:0.5}
.pc-notel{font-size:11px;color:var(--tx3);font-style:italic}

/* ─ LOADING ─ */
.loading{
  display:flex;flex-direction:column;align-items:center;
  gap:14px;padding:100px 20px;color:var(--tx2);font-size:11px;
  font-family:'DM Mono',monospace;letter-spacing:0.1em;text-transform:uppercase;
}
.spin{
  width:24px;height:24px;
  border:1.5px solid var(--line2);border-top-color:var(--gold);
  border-radius:50%;animation:sp 0.75s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ─ FOOTER ─ */
.footer{
  text-align:center;padding:28px 20px;font-size:10px;
  color:var(--tx3);letter-spacing:0.18em;text-transform:uppercase;
  font-family:'DM Mono',monospace;border-top:1px solid var(--line);
}
.footer span{color:var(--tx2)}

/* ══════════════════════════════════════
   RESPONSIVE — MOBILE
   Manager strip hidden on desktop mobile
   → replaced by .tc-mgr-mobile inside
     .tc-info (always rendered in DOM)
══════════════════════════════════════ */
@media(max-width:680px){

  /* Collapse grid columns: bar | logo | info+mobile-mgr | chevron */
  .tc-head{
    grid-template-columns:4px 56px 1fr 44px;
    min-height:auto;
  }

  /* Hide desktop manager panel */
  .tc-mgr{display:none}

  /* Show mobile manager row */
  .tc-mgr-mobile{display:flex}

  /* Slightly smaller logo */
  .tc-logo{width:40px;height:40px}
  .tc-logo-wrap{padding:8px 4px}

  /* Tighter info padding */
  .tc-info{padding:10px 12px;gap:5px}

  /* Smaller team name */
  .tc-name{font-size:1.15rem}

  /* Player grid 2-col on mobile */
  .pgrid{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }

  .tc-roster{padding:12px}

  /* Stats bar full width */
  .stat{padding:14px 18px}
  .stats-bar{width:100%;justify-content:stretch}
  .stat{flex:1}

  .hero-title{font-size:clamp(3.2rem,13vw,5rem)}
  .wrap{padding:32px 14px 80px}
}
</style>
</head>
<body>

<section class="hero">
  <div class="hero-grain"></div>
  <div class="hero-lines"></div>
  <div class="hero-glow"></div>
  <div class="hero-inner">
    <div class="pill"><span class="pill-dot"></span>Official Squad Registry · 2025</div>
    <h1 class="hero-title">Vaikom<span class="accent">Football</span>League</h1>
    <p class="hero-sub">Kerala &nbsp;·&nbsp; India &nbsp;·&nbsp; Season 2025</p>
    <div class="stats-bar">
      <div class="stat"><span class="stat-n" id="sTeams">—</span><span class="stat-l">Teams</span></div>
      <div class="stat"><span class="stat-n" id="sPlayers">—</span><span class="stat-l">Players</span></div>
      <div class="stat"><span class="stat-n" id="sIcons">—</span><span class="stat-l">Icon Players</span></div>
    </div>
  </div>
</section>

<div id="loading" class="loading"><div class="spin"></div>Loading squads…</div>
<main class="wrap" id="root"></main>
<footer class="footer"><span>Vaikom Football League</span> &nbsp;·&nbsp; All Rights Reserved &nbsp;·&nbsp; 2025</footer>

<script>
const TEAMS = {
  "alpha-lions"   :{ logo:"images/alpha_lions_fc.jpeg",       manager:"Ashique",   mgrPhoto:"images/Managers/ashqiue.jpeg",  phone:"" },
  "delta-united"  :{ logo:"images/delta_united.jpeg",         manager:"Achu",      mgrPhoto:"images/Managers/achu.jpeg",     phone:"" },
  "emirate"       :{ logo:"images/fc_emirate.jpeg",           manager:"Zaad",      mgrPhoto:"images/Managers/zaad.jpeg",     phone:"" },
  "fitwell"       :{ logo:"images/fc_fitwell.jpeg",           manager:"Jobin",     mgrPhoto:"images/Managers/jobin.jpeg",    phone:"" },
  "golden-age"    :{ logo:"images/golden_age.jpeg",           manager:"Sreesanth", mgrPhoto:"images/Managers/sreesanth.jpeg",phone:"" },
  "la-carrington" :{ logo:"images/la_carrington_vaikom.jpeg", manager:"Rakesh",    mgrPhoto:"images/Managers/rakesh.jpeg",   phone:"" },
  "rivals"        :{ logo:"images/rivals_fc_vaikom.jpeg",     manager:"Udith",     mgrPhoto:"images/Managers/udith.jpeg",    phone:"" },
  "riverside"     :{ logo:"images/riverside_fc.jpeg",         manager:"Jijin",     mgrPhoto:"images/Managers/jijin.jpeg",    phone:"" },
  "titans"        :{ logo:"images/titans_fc_vaikom.jpeg",     manager:"Sreeraman", mgrPhoto:"images/Managers/sreeraman.jpeg",phone:"" },
  "titian"        :{ logo:"images/titans_fc_vaikom.jpeg",     manager:"Sreeraman", mgrPhoto:"images/Managers/sreeraman.jpeg",phone:"" }
};

const SHEET_ID = '1_AbPUa7BJFbox43ElPcdcuFoA3F3avbwOjn_ZsoFiZA';
const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

const slug = n => !n ? '' : n.toString().toLowerCase().trim()
  .replace(/\bfc\b/gi,'').replace(/\bvaikom\b/gi,'')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');

function findCfg(teamName) {
  const s = slug(teamName);
  if (TEAMS[s]) return TEAMS[s];
  const keys = Object.keys(TEAMS);
  for (const k of keys) { if (s.includes(k) || k.includes(s)) return TEAMS[k]; }
  const sw = s.split('-').filter(Boolean);
  let best = null, score = 0;
  for (const k of keys) {
    const kw = k.split('-').filter(Boolean);
    const sc = sw.filter(w => kw.includes(w)).length;
    if (sc > score) { score = sc; best = TEAMS[k]; }
  }
  return score > 0 ? best : { logo:'', manager:'Head Coach', mgrPhoto:'', phone:'' };
}

const initials = n => (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const driveThumb = u => {
  if (!u) return null;
  const m = u.match(/(?:id=|file\/d\/)([\w-]+)/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}` : u;
};
const phoneSVG = () =>
  `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>`;
const personSVG = () =>
  `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="0.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`;

window.showPH = (el, abbr) => {
  el.innerHTML = `<div class="pc-ph">${personSVG()}<span>${abbr}</span></div>`;
};

/* Image with lowercase/uppercase Managers/ folder fallback */
function tryBothCases(src) {
  return src
    .replace('/Managers/','/managers/')
    .replace('/managers/','/Managers/');
}

function imgTag(src, alt, onErr) {
  const alt1 = tryBothCases(src);
  return `<img src="${src}" alt="${alt}"
    onerror="if(!this.dataset.t){this.dataset.t=1;this.src='${alt1}'}else{${onErr}}">`
}

/* ── Logo ── */
function logoHTML(src, name) {
  const fb = initials(name);
  if (!src) return `<div class="tc-logo"><span class="tc-logo-text">${fb}</span></div>`;
  const onErr = `this.style.display='none';this.parentNode.insertAdjacentHTML('beforeend','<span class="tc-logo-text">${fb}</span>')`;
  return `<div class="tc-logo">${imgTag(src, name, onErr)}</div>`;
}

/* ── Desktop manager strip ── */
function mgrDesktopHTML(cfg) {
  const n   = cfg.manager || 'Head Coach';
  const fb  = initials(n);
  const ph  = cfg.mgrPhoto || '';
  const onErr = `this.style.display='none';this.parentNode.insertAdjacentHTML('beforeend','<span class="mgr-av-text">${fb}</span>')`;
  const avHTML = ph
    ? `<div class="mgr-av">${imgTag(ph, n, onErr)}</div>`
    : `<div class="mgr-av"><span class="mgr-av-text">${fb}</span></div>`;
  return `<div class="tc-mgr">
    ${avHTML}
    <div>
      <div class="mgr-role">Manager</div>
      <div class="mgr-name">${n}</div>
      ${cfg.phone ? `<div class="mgr-phone">${cfg.phone}</div>` : ''}
    </div>
  </div>`;
}

/* ── Mobile manager row (inside tc-info, always in DOM) ── */
function mgrMobileHTML(cfg) {
  const n  = cfg.manager || 'Head Coach';
  const fb = initials(n);
  const ph = cfg.mgrPhoto || '';
  const onErr = `this.style.display='none';this.parentNode.insertAdjacentHTML('beforeend','<span class="mgr-av-sm-text">${fb}</span>')`;
  const avHTML = ph
    ? `<div class="mgr-av-sm">${imgTag(ph, n, onErr)}</div>`
    : `<div class="mgr-av-sm"><span class="mgr-av-sm-text">${fb}</span></div>`;
  return `<div class="tc-mgr-mobile">
    ${avHTML}
    <div class="mgr-mobile-info">
      <div class="mgr-mobile-label">Manager</div>
      <div class="mgr-mobile-name">${n}</div>
    </div>
  </div>`;
}

/* ── Player card ── */
function playerCardHTML(p) {
  const name     = (p['Name']||'').trim() || 'Unknown';
  const phone    = (p['Contact Number']||'').trim();
  const pos      = (p['Preferred Playing Position '] || p['Preferred Playing Position'] || 'N/A').trim();
  const photoSrc = driveThumb(p['Player Photo']);
  const isIcon   = (p['Icon Player']||'').trim().toLowerCase() === 'yes';
  const abbr     = initials(name);
  const photoHTML = photoSrc
    ? `<img src="${photoSrc}" alt="${name}" loading="lazy" onerror="showPH(this.parentNode,'${abbr}')">`
    : `<div class="pc-ph">${personSVG()}<span>${abbr}</span></div>`;
  return `<div class="pc${isIcon?' icon':''}">
    ${isIcon ? '<span class="pc-crown">★ Icon</span>' : ''}
    <div class="pc-img">${photoHTML}</div>
    <div class="pc-body">
      <div class="pc-name">${name}</div>
      <div class="pc-pos">${pos}</div>
      <div class="pc-sep"></div>
      <div class="pc-tel">
        ${phone
          ? `<a href="tel:${phone.replace(/\s+/g,'')}">${phoneSVG()}<span>${phone}</span></a>`
          : `<span class="pc-notel">No contact</span>`}
      </div>
    </div>
  </div>`;
}

window.toggleCard = el => el.classList.toggle('open');

function render(rows) {
  document.getElementById('loading').style.display = 'none';
  const root = document.getElementById('root');
  root.innerHTML = '';

  const map = {};
  rows.forEach(r => {
    const t = (r['Team']||'').trim() || 'Unassigned';
    (map[t] = map[t]||[]).push(r);
  });

  const names = Object.keys(map).sort();
  let tp = 0, ti = 0;
  document.getElementById('sTeams').textContent = names.length;
  root.insertAdjacentHTML('beforeend',`<div class="section-label">All Teams — Season 2025</div>`);

  names.forEach((teamName, idx) => {
    const cfg  = findCfg(teamName);
    const list = map[teamName];
    tp += list.length;
    list.forEach(p => { if ((p['Icon Player']||'').toLowerCase()==='yes') ti++; });
    list.sort((a,b) => {
      const ia = (a['Icon Player']||'').toLowerCase()==='yes' ? 1 : 0;
      const ib = (b['Icon Player']||'').toLowerCase()==='yes' ? 1 : 0;
      return ia!==ib ? ib-ia : (a['Name']||'').localeCompare(b['Name']||'');
    });

    const card = document.createElement('div');
    card.className = 'team-card' + (idx===0 ? ' open' : '');
    card.innerHTML = `
      <div class="tc-head" onclick="toggleCard(this.closest('.team-card'))">
        <div class="tc-bar"></div>
        <div class="tc-logo-wrap">${logoHTML(cfg.logo||'', teamName)}</div>
        <div class="tc-info">
          <div class="tc-name">${teamName}</div>
          <div class="tc-meta">
            <span class="tc-chip g">${list.length} Players</span>
            ${cfg.manager ? `<span class="tc-chip w">${cfg.manager}</span>` : ''}
          </div>
          ${teamName !== 'Unassigned' ? mgrMobileHTML(cfg) : ''}
        </div>
        ${teamName !== 'Unassigned' ? mgrDesktopHTML(cfg) : '<div></div>'}
        <div class="tc-chev-cell">
          <div class="tc-chev"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></div>
        </div>
      </div>
      <div class="tc-roster"><div class="pgrid" id="g-${idx}"></div></div>`;

    root.appendChild(card);
    const grid = card.querySelector('.pgrid');
    list.forEach(p => grid.insertAdjacentHTML('beforeend', playerCardHTML(p)));
  });

  document.getElementById('sPlayers').textContent = tp;
  document.getElementById('sIcons').textContent   = ti;
}

(async () => {
  try {
    const r = await fetch(CSV_URL);
    if (!r.ok) throw new Error('Could not load squad data.');
    Papa.parse(await r.text(), {
      header:true, skipEmptyLines:true,
      complete:({data}) => render(data)
    });
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<span style="color:#c0392b;font-family:'DM Mono',monospace;font-size:12px">${e.message}</span>`;
  }
})();
</script>
</body>
